services:

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: vietmart-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: >
        INTERNAL://0.0.0.0:29092,
        EXTERNAL://0.0.0.0:9092,
        CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka:29092,
        EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - vietmart-network
    restart: unless-stopped


  redis:
    image: redis:latest
    container_name: vietmart-redis
    ports:
      - "6379:6379"
    networks:
      - vietmart-network
    restart: unless-stopped


  # Database cho Orders Service
  mysql-orders:
    image: mysql:8.4
    container_name: vietmart-mysql-orders
    ports:
      - "3307:3306" # Trỏ cổng host 3307 vào 3306 container (khớp với url jdbc trong orders-service.yml)
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: 123456789
    volumes:
      - mysql-orders-data:/var/lib/mysql
    networks:
      - vietmart-network
    restart: unless-stopped

networks:
  vietmart-network:
    driver: bridge

volumes:
  mysql-orders-data:
